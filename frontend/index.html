<!doctype html>
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gridl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* The splash paints with the first HTML, before any JavaScript loads; main.tsx removes it. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        color: #1d1d1f;
        font: 600 15px -apple-system, BlinkMacSystemFont, "Manrope", sans-serif;
        letter-spacing: 0.01em;
        transition: opacity 180ms ease-out;
        -webkit-user-select: none;
        user-select: none;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash .empty {
        color: rgba(0, 0, 0, 0.12);
      }
      #splash span {
        opacity: 0.55;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #1e1e1e;
          color: #f5f5f7;
        }
        #splash .empty {
          color: rgba(255, 255, 255, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg width="76" height="76" viewBox="0 0 1024 1024">
        <defs>
          <linearGradient id="splash-shade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3D8BFF" />
            <stop offset="0.55" stop-color="#2F5BF0" />
            <stop offset="1" stop-color="#4B2FCF" />
          </linearGradient>
          <clipPath id="splash-fill">
            <!-- The same rising wave as the in-app loader (workspace/LogoLoader.tsx). -->
            <path d="M-1024 40 Q-896 -20 -768 40 T-512 40 T-256 40 T0 40 T256 40 T512 40 T768 40 T1024 40 T1280 40 T1536 40 T1792 40 T2048 40 V1200 H-1024 Z">
              <animateTransform attributeName="transform" type="translate" values="0 960; 0 0; 0 0" keyTimes="0; 0.78; 1" calcMode="spline" keySplines="0.45 0.05 0.35 1; 0 0 1 1" dur="2.4s" repeatCount="indefinite" />
              <animateTransform attributeName="transform" type="translate" from="0 0" to="512 0" dur="1.2s" repeatCount="indefinite" additive="sum" />
            </path>
          </clipPath>
        </defs>
        <g class="empty" fill="currentColor">
          <rect x="100" y="100" width="824" height="824" rx="186" />
        </g>
        <g clip-path="url(#splash-fill)">
          <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#splash-shade)" />
          <rect x="226" y="330" width="572" height="430" rx="54" fill="#FFFFFF" />
          <rect x="226" y="330" width="572" height="96" fill="#C9D6FF" />
          <rect x="226" y="524" width="572" height="98" fill="#2F6BFF" fill-opacity="0.92" />
          <g stroke="#B7C5F5" stroke-width="7">
            <line x1="226" y1="426" x2="798" y2="426" />
            <line x1="226" y1="622" x2="798" y2="622" />
            <line x1="417" y1="330" x2="417" y2="760" />
            <line x1="607" y1="330" x2="607" y2="760" />
          </g>
          <g transform="translate(662 214)">
            <path d="M0 52 v86 c0 24 46 44 104 44 s104 -20 104 -44 v-86 z" fill="#EEF2FF" />
            <ellipse cx="104" cy="52" rx="104" ry="44" fill="#FFFFFF" />
            <ellipse cx="104" cy="52" rx="74" ry="26" fill="#C9D6FF" />
          </g>
        </g>
      </svg>
      <span>Gridl</span>
    </div>
    <div id="root"></div>
    <div id="portal"></div>
    <script type="module" src="/src/boot.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
