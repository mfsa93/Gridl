version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    # Rebasing on every push to develop re-ran CI on each open update; rebase on request instead.
    rebase-strategy: disabled
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    rebase-strategy: disabled
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    rebase-strategy: disabled
    schedule:
      interval: monthly
