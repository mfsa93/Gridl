name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gridl version
      description: Gridl → Acerca de Gridl (About Gridl)
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [PostgreSQL, MySQL / MariaDB, SQLite, Not applicable]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
