name: Release

# Push a tag like v0.2.1 to build, sign, and publish a release. Installed copies
# of Gridl find it through latest.json and offer to update.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/gridl-desktop
          tauriScript: ../../frontend/node_modules/.bin/tauri
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Gridl ${{ github.ref_name }}
          releaseBody: Download the .dmg to install, or run the one-line installer from the README. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
