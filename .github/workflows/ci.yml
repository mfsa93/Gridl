name: CI

# Checks only: builds and tests, never packages. Releases come from release.yml on v* tags.
on:
  pull_request:
  push:
    branches: [master, develop]

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gridl
          POSTGRES_DB: gridl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gridl
          MYSQL_DATABASE: gridl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -pgridl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GRIDL_TEST_PG: postgres:gridl@127.0.0.1:5432/gridl
      GRIDL_TEST_MYSQL: root:gridl@127.0.0.1:3306/gridl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p gridl-core --all-targets -- -D warnings
      - run: cargo test -p gridl-core

  desktop:
    name: Tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: cargo clippy -p gridl-desktop --all-targets -- -D warnings
      - run: cargo test -p gridl-desktop

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend exec tsc --noEmit
      - run: pnpm --dir frontend exec vite build
