name: CI

# Checks only: builds and tests, never packages. Releases come from release.yml on v* tags.
# Every pull request gets a run, because branch protection requires these
# checks; when only docs or the license changed, or the PR is develop into
# master (the same code develop's PRs already tested), the jobs are skipped,
# which counts as passing.
# Pushes to develop run too: a PR can restore caches from its base branch, so
# that run leaves the Rust cache warm for the next PR.
on:
  pull_request:
  push:
    branches:
      - develop

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' && !(github.base_ref == 'master' && github.head_ref == 'develop') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!LICENSE"

  core:
    name: Rust core
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gridl
          POSTGRES_DB: gridl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gridl
          MYSQL_DATABASE: gridl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -pgridl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Gridl_Test1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Gridl_Test1 -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      GRIDL_TEST_PG: postgres:gridl@127.0.0.1:5432/gridl
      GRIDL_TEST_MYSQL: root:gridl@127.0.0.1:3306/gridl
      GRIDL_TEST_MSSQL: sa:Gridl_Test1@127.0.0.1:1433/gridl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      # Compiled dependencies carry over between runs; only changed crates rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo fmt --all --check
      - run: cargo clippy -p gridl-core --all-targets -- -D warnings
      - run: cargo test -p gridl-core

  desktop:
    name: Tauri shell
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      # The WebKit and GTK headers Tauri builds against. Plain apt-get: the
      # cached-packages action hung while installing on the current image.
      - name: System packages
        timeout-minutes: 8
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - run: cargo clippy -p gridl-desktop --all-targets -- -D warnings
      - run: cargo test -p gridl-desktop

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend exec tsc --noEmit
      - run: pnpm --dir frontend exec vite build
