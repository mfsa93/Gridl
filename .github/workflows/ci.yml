name: CI

# Checks only: builds and tests, never packages. Releases come from release.yml on v* tags.
# Pull requests only: master and develop change through PRs, and a PR's run
# already tests the merged result, so a second run on push would repeat it.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gridl
          POSTGRES_DB: gridl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gridl
          MYSQL_DATABASE: gridl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -pgridl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Gridl_Test1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Gridl_Test1 -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      GRIDL_TEST_PG: postgres:gridl@127.0.0.1:5432/gridl
      GRIDL_TEST_MYSQL: root:gridl@127.0.0.1:3306/gridl
      GRIDL_TEST_MSSQL: sa:Gridl_Test1@127.0.0.1:1433/gridl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      # Compiled dependencies carry over between runs; only changed crates rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo fmt --all --check
      - run: cargo clippy -p gridl-core --all-targets -- -D warnings
      - run: cargo test -p gridl-core

  desktop:
    name: Tauri shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      # The WebKit and GTK headers Tauri builds against, restored from the
      # cache instead of downloaded from the Ubuntu mirrors on every run.
      - name: System packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
          version: tauri-2
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - run: cargo clippy -p gridl-desktop --all-targets -- -D warnings
      - run: cargo test -p gridl-desktop

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend exec tsc --noEmit
      - run: pnpm --dir frontend exec vite build
