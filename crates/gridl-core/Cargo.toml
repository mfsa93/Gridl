[package]
name = "gridl-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Engine-agnostic database ports and drivers for Gridl"

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
csv = "1.3"
dunce.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sys-locale = "0.3"
thiserror.workspace = true
# SQL Server: sqlx dropped its driver, tiberius speaks TDS natively.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { workspace = true, features = ["sync", "time", "net", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true

[lints]
workspace = true
