[package]
name = "gridl-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tauri shell for the Gridl database client"

[lib]
name = "gridl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gridl"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
async-trait.workspace = true
gridl-core = { path = "../gridl-core" }
russh = "=0.65.0"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true, features = ["net", "io-util", "process", "sync", "time", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[lints]
workspace = true
