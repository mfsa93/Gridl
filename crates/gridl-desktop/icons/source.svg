<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="0.55" stop-color="#2F5BF0"/>
      <stop offset="1" stop-color="#4B2FCF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEFF"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7ECFF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E1FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1440" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10185A" flood-opacity="0.35"/>
    </filter>
    <clipPath id="cardClip"><rect x="226" y="330" width="572" height="430" rx="54"/></clipPath>
  </defs>

  <!-- macOS icon grid: 824 px rounded square centered on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Table card -->
  <g filter="url(#soft)">
    <rect x="226" y="330" width="572" height="430" rx="54" fill="url(#card)"/>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="226" y="330" width="572" height="96" fill="#C9D6FF"/>
    <rect x="226" y="524" width="572" height="98" fill="#2F6BFF" fill-opacity="0.92"/>
    <g stroke="#B7C5F5" stroke-width="7">
      <line x1="226" y1="426" x2="798" y2="426"/>
      <line x1="226" y1="524" x2="798" y2="524"/>
      <line x1="226" y1="622" x2="798" y2="622"/>
      <line x1="417" y1="330" x2="417" y2="760"/>
      <line x1="607" y1="330" x2="607" y2="760"/>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.95">
      <rect x="258" y="561" width="122" height="24" rx="12"/>
      <rect x="448" y="561" width="128" height="24" rx="12"/>
      <rect x="638" y="561" width="96" height="24" rx="12"/>
    </g>
    <g fill="#9DB0EC">
      <rect x="258" y="462" width="110" height="24" rx="12"/>
      <rect x="448" y="462" width="132" height="24" rx="12"/>
      <rect x="638" y="462" width="84" height="24" rx="12"/>
      <rect x="258" y="659" width="96" height="24" rx="12"/>
      <rect x="448" y="659" width="118" height="24" rx="12"/>
      <rect x="638" y="659" width="104" height="24" rx="12"/>
    </g>
    <g fill="#6F86D6">
      <rect x="258" y="366" width="86" height="24" rx="12"/>
      <rect x="448" y="366" width="104" height="24" rx="12"/>
      <rect x="638" y="366" width="78" height="24" rx="12"/>
    </g>
  </g>

  <!-- Database badge -->
  <g filter="url(#soft)" transform="translate(662 214)">
    <path d="M0 52 v86 c0 24 46 44 104 44 s104 -20 104 -44 v-86 z" fill="url(#disk)"/>
    <path d="M0 95 c0 24 46 44 104 44 s104 -20 104 -44" fill="none" stroke="#B7C5F5" stroke-width="7"/>
    <ellipse cx="104" cy="52" rx="104" ry="44" fill="#FFFFFF"/>
    <ellipse cx="104" cy="52" rx="74" ry="26" fill="#C9D6FF"/>
  </g>
</svg>
